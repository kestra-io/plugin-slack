title: "Slack Conversations"
description: "Tasks that manage Slack channels, DMs, and conversation history."
body: "Requires a bot `token` with conversation scopes; supply a `channel`/`conversationId` for membership changes, renames, archiving, or topic/purpose updates, and use `cursor`/`limit` options when listing or pulling history. Useful for provisioning channels, moderating membership, or paging archives from workflows."

group: io.kestra.plugin.slack.app.chats
name: "chats"
title: "Slack Chats"
description: "Tasks that post, update, schedule, or stream Slack chat messages."
body: "Use a bot `token` with `chat:write` to send JSON `payload` or `messageText` to a `channel`; updates/deletes/scheduling rely on the message `timestamp`, and streaming tasks share the `streamId` and `threadTs` outputs across Start/Append/Stop. Ideal for alerts, threaded updates, or long-running progress feeds."

id: slack-successful
namespace: io.kestra.tests

inputs:
  - id: url
    type: STRING
    required: true
    defaults: "http://localhost:59443"


tasks:
  - id: slack-successful
    type: io.kestra.plugin.slack.notifications.SlackExecution
    url: "{{ inputs.url }}/webhook-unit-test"
    channel: "#random"
    customFields:
      Env: DEV
      Cloud: GCP
    customMessage: myCustomMessage
    executionId: "{{trigger.executionId}}"

triggers:
  - id: on_success
    type: io.kestra.plugin.core.trigger.Flow
    inputs:
      url: "{{ inputs.url }}"
    dependsOn:
      - namespace: io.kestra.tests
        flowId: main-flow-that-succeeds
        states: [ SUCCESS ]

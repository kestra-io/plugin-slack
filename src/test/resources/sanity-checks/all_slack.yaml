id: all_slack
namespace: sanitychecks.plugin-slack

tasks:
  - id: call_subflows_in_loop
    type: io.kestra.plugin.core.flow.Loop
    values:
      - chat-reactions
      - chat-schedule
      - chat-stream
      - file
      - user
    tasks:
      - id: call-subflow-task
        type: io.kestra.plugin.core.flow.Subflow
        namespace: "{{ flow.namespace }}"
        flowId: "{{ item.value }}"
        wait: true
        transmitFailed: true
        inputs:
          token: "{{ secret('SLACK_BOT_TOKEN') }}"